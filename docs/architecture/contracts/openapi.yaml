openapi: 3.1.0
info:
  title: "In-EHR supplement orders API"
  version: "0.1.0"
  description: "Contract for M4-M6 (tracer bullet, prices and stock, measurement and operations). Shapes are designed in docs/architecture/lld.md section 4. One deployable, API-first (hld.md D34): the Vue pages call these JSON operations on the same origin."
servers:
  - url: "http://localhost:3000"
    description: local
security:
  - sessionCookie: []
tags:
  - name: pages
  - name: session
  - name: orders
  - name: practice
  - name: operations
  - name: finance
  - name: access
paths:
  "/sign-in":
    get:
      x-lld-id: "EP-1"
      operationId: signInPage
      summary: "Sign-in page (S8)"
      tags: [pages]
      security: []
      parameters:
        - name: next
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: "Sign-in page (S8), server-rendered"
          content:
            text/html:
              schema:
                type: string
  "/notices/{token}":
    get:
      x-lld-id: "EP-2"
      operationId: noticePage
      summary: "Order notice page (S9)"
      tags: [pages]
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Order notice page (S9), server-rendered"
          content:
            text/html:
              schema:
                type: string
        "404":
          description: "/problems/not-found"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  "/patients/{patientId}/supplements":
    get:
      x-lld-id: "EP-3"
      operationId: orderBuilderPage
      summary: "Supplement order in the patient's chart (S1)"
      tags: [pages]
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: "Supplement order in the patient's chart (S1), server-rendered"
          content:
            text/html:
              schema:
                type: string
        "401":
          description: "/problems/unauthenticated"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: "/problems/not-found"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  "/orders/{orderId}":
    get:
      x-lld-id: "EP-4"
      operationId: patientOrderPage
      summary: "Your supplement order and checkout (S2)"
      tags: [pages]
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: "Your supplement order and checkout (S2), server-rendered"
          content:
            text/html:
              schema:
                type: string
        "401":
          description: "/problems/unauthenticated"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: "/problems/not-found"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  "/ops/orders":
    get:
      x-lld-id: "EP-5"
      operationId: opsOrdersPage
      summary: "Paid orders (S3)"
      tags: [pages]
      responses:
        "200":
          description: "Paid orders (S3), server-rendered"
          content:
            text/html:
              schema:
                type: string
        "401":
          description: "/problems/unauthenticated"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: "/problems/forbidden"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  "/ops/orders/{orderId}":
    get:
      x-lld-id: "EP-6"
      operationId: orderBreakdownPage
      summary: "Paid order breakdown (S4)"
      tags: [pages]
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: "Paid order breakdown (S4), server-rendered"
          content:
            text/html:
              schema:
                type: string
        "401":
          description: "/problems/unauthenticated"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: "/problems/forbidden"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: "/problems/not-found"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  "/practice/prices":
    get:
      x-lld-id: "EP-7"
      operationId: practicePricesPage
      summary: "Practice prices (S5)"
      tags: [pages]
      responses:
        "200":
          description: "Practice prices (S5), server-rendered"
          content:
            text/html:
              schema:
                type: string
        "401":
          description: "/problems/unauthenticated"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: "/problems/forbidden"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  "/practice/dashboard":
    get:
      x-lld-id: "EP-8"
      operationId: practiceDashboardPage
      summary: "Practice dashboard (S6)"
      tags: [pages]
      parameters:
        - name: month
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: "Practice dashboard (S6), server-rendered"
          content:
            text/html:
              schema:
                type: string
        "401":
          description: "/problems/unauthenticated"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: "/problems/forbidden"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  "/ops/stock":
    get:
      x-lld-id: "EP-9"
      operationId: stockPage
      summary: "Stock adjustments (S7)"
      tags: [pages]
      responses:
        "200":
          description: "Stock adjustments (S7), server-rendered"
          content:
            text/html:
              schema:
                type: string
        "401":
          description: "/problems/unauthenticated"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: "/problems/forbidden"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  "/ops/health":
    get:
      x-lld-id: "EP-10"
      operationId: platformHealthPage
      summary: "Platform health (S10)"
      tags: [pages]
      parameters:
        - name: month
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: "Platform health (S10), server-rendered"
          content:
            text/html:
              schema:
                type: string
        "303":
          description: "Signed out: redirect to /sign-in?next=<this page> (EP-1). A signed-in person whose role does not allow the page gets 200 with only the page's Permission denied state, because the page's API call answered 403 (FR-058)."
          headers:
            Location:
              schema:
                type: string
  "/ops/finance":
    get:
      x-lld-id: "EP-11"
      operationId: financialReportPage
      summary: "Financial report (S11)"
      tags: [pages]
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: "Financial report (S11), server-rendered"
          content:
            text/html:
              schema:
                type: string
        "303":
          description: "Signed out: redirect to /sign-in?next=<this page> (EP-1). A signed-in person whose role does not allow the page gets 200 with only the page's Permission denied state, because the page's API call answered 403 (FR-058)."
          headers:
            Location:
              schema:
                type: string
  "/ops/access":
    get:
      x-lld-id: "EP-12"
      operationId: operationsAccessPage
      summary: "Operations access (S12)"
      tags: [pages]
      responses:
        "200":
          description: "Operations access (S12), server-rendered"
          content:
            text/html:
              schema:
                type: string
        "303":
          description: "Signed out: redirect to /sign-in?next=<this page> (EP-1). A signed-in person whose role does not allow the page gets 200 with only the page's Permission denied state, because the page's API call answered 403 (FR-058)."
          headers:
            Location:
              schema:
                type: string
  "/ops/access-log":
    get:
      x-lld-id: "EP-13"
      operationId: accessLogPage
      summary: "Access log (S13)"
      tags: [pages]
      parameters:
        - name: month
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: "Access log (S13), server-rendered"
          content:
            text/html:
              schema:
                type: string
        "303":
          description: "Signed out: redirect to /sign-in?next=<this page> (EP-1). A signed-in person whose role does not allow the page gets 200 with only the page's Permission denied state, because the page's API call answered 403 (FR-058)."
          headers:
            Location:
              schema:
                type: string
  "/ops/system":
    get:
      x-lld-id: "EP-14"
      operationId: systemHealthPage
      summary: "System health (S14)"
      tags: [pages]
      parameters:
        - name: month
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: "System health (S14), server-rendered"
          content:
            text/html:
              schema:
                type: string
        "303":
          description: "Signed out: redirect to /sign-in?next=<this page> (EP-1). A signed-in person whose role does not allow the page gets 200 with only the page's Permission denied state, because the page's API call answered 403 (FR-058)."
          headers:
            Location:
              schema:
                type: string
  "/api/session":
    post:
      x-lld-id: "EP-15"
      operationId: signIn
      summary: "Sign in"
      tags: [session]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
      responses:
        "200":
          description: "Sign in"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: "/problems/sign-in-failed"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: "/problems/forbidden: the password matched but the account's role is none, so no session is opened (lld.md Q-11)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: "/problems/validation"
          content:
            application/problem+json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/ValidationProblem"
                  - $ref: "#/components/schemas/Problem"
        "429":
          description: "/problems/rate-limited"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      x-lld-id: "EP-16"
      operationId: signOut
      summary: "Sign out"
      tags: [session]
      responses:
        "204":
          description: "Sign out"
        "401":
          description: "/problems/unauthenticated"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    get:
      x-lld-id: "EP-17"
      operationId: getSession
      summary: "Who is signed in"
      tags: [session]
      responses:
        "200":
          description: "Who is signed in"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: "/problems/unauthenticated"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  "/api/patients/{patientId}/catalog":
    get:
      x-lld-id: "EP-18"
      operationId: getCatalog
      summary: "Products with this practice's prices and stock"
      tags: [orders]
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: "Products with this practice's prices and stock"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Catalog"
        "401":
          description: "/problems/unauthenticated"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: "/problems/forbidden"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: "/problems/not-found"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  "/api/orders":
    post:
      x-lld-id: "EP-19"
      operationId: sendOrder
      summary: "Send an order to a patient"
      tags: [orders]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendOrderRequest"
      responses:
        "201":
          description: "Send an order to a patient"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: "/problems/idempotency-key-missing"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: "/problems/unauthenticated"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: "/problems/forbidden"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: "/problems/not-found"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "/problems/idempotency-in-flight"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: "/problems/validation, /problems/below-price-floor, /problems/insufficient-stock, /problems/idempotency-mismatch"
          content:
            application/problem+json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/ValidationProblem"
                  - $ref: "#/components/schemas/Problem"
  "/api/orders/{orderId}/cancel":
    post:
      x-lld-id: "EP-20"
      operationId: cancelOrder
      summary: "Cancel a sent, unpaid order"
      tags: [orders]
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: "Cancel a sent, unpaid order"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          description: "/problems/unauthenticated"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: "/problems/not-found"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "/problems/invalid-transition"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/InvalidTransitionProblem"
  "/api/orders/{orderId}":
    get:
      x-lld-id: "EP-21"
      operationId: getOrder
      summary: "One order with current or held prices and price-change notices"
      tags: [orders]
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: "One order with current or held prices and price-change notices"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderView"
        "401":
          description: "/problems/unauthenticated"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: "/problems/not-found"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  "/api/orders/{orderId}/checkout":
    post:
      x-lld-id: "EP-22"
      operationId: startCheckout
      summary: "Start checkout and hold prices for 30 minutes"
      tags: [orders]
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: "Start checkout and hold prices for 30 minutes"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Checkout"
        "401":
          description: "/problems/unauthenticated"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: "/problems/not-found"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "/problems/invalid-transition"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/InvalidTransitionProblem"
  "/api/orders/{orderId}/payments":
    post:
      x-lld-id: "EP-23"
      operationId: payOrder
      summary: "Pay for an order with the test payment"
      tags: [orders]
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: "Pay for an order with the test payment"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Receipt"
        "400":
          description: "/problems/idempotency-key-missing"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: "/problems/unauthenticated"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: "/problems/not-found"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "/problems/idempotency-in-flight, /problems/invalid-transition, /problems/checkout-expired"
          content:
            application/problem+json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/InvalidTransitionProblem"
                  - $ref: "#/components/schemas/Problem"
        "422":
          description: "/problems/insufficient-stock, /problems/order-under-review, /problems/idempotency-mismatch"
          content:
            application/problem+json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/ValidationProblem"
                  - $ref: "#/components/schemas/Problem"
        "429":
          description: "/problems/rate-limited (more than 10 payment attempts in 15 minutes for one person or one address)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          description: "/problems/payment-failed"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  "/api/notices/{token}":
    get:
      x-lld-id: "EP-24"
      operationId: getNotice
      summary: "A patient notice (practice name only)"
      tags: [orders]
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "A patient notice (practice name only)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notice"
        "404":
          description: "/problems/not-found"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  "/api/ops/orders":
    get:
      x-lld-id: "EP-25"
      operationId: listOpsOrders
      summary: "Paid orders or the review list, by order number"
      tags: [operations]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: number
          in: query
          required: false
          schema:
            type: integer
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: "Paid orders or the review list, by order number"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsOrderPage"
        "401":
          description: "/problems/unauthenticated"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: "/problems/forbidden"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: "/problems/validation"
          content:
            application/problem+json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/ValidationProblem"
                  - $ref: "#/components/schemas/Problem"
  "/api/ops/orders/{orderId}":
    get:
      x-lld-id: "EP-26"
      operationId: getOrderBreakdown
      summary: "Where every cent of one order went"
      tags: [operations]
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: "Where every cent of one order went"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderBreakdown"
        "401":
          description: "/problems/unauthenticated"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: "/problems/forbidden"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: "/problems/not-found"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  "/api/practice/prices":
    get:
      x-lld-id: "EP-27"
      operationId: listPrices
      summary: "This practice's prices and price history"
      tags: [practice]
      parameters:
        - name: history_cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: "This practice's prices and price history"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceList"
        "401":
          description: "/problems/unauthenticated"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: "/problems/forbidden"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: "/problems/validation (an unknown, malformed or impossible cursor)"
          content:
            application/problem+json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/ValidationProblem"
                  - $ref: "#/components/schemas/Problem"
  "/api/practice/prices/{productId}":
    put:
      x-lld-id: "EP-28"
      operationId: changePrice
      summary: "Change one product's practice price, with a reason"
      tags: [practice]
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceChangeRequest"
      responses:
        "200":
          description: "Change one product's practice price, with a reason"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticePrice"
        "400":
          description: "/problems/idempotency-key-missing"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: "/problems/unauthenticated"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: "/problems/forbidden"
          content:
