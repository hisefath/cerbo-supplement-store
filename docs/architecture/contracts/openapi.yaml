components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: "HTTP-only, Secure, SameSite=Lax session cookie set by EP-15; idle limit 15 minutes (NFR-008)."
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: "Client-generated UUID. Same key + same body replays the stored response for 24 h."
      schema:
        type: string
        maxLength: 255
    Cursor:
      name: cursor
      in: query
      required: false
      description: "Opaque cursor from the previous page's next_cursor. An unknown, malformed or impossible cursor is 422 /problems/validation (lld.md BE-22)."
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  schemas:
    Problem:
      type: object
      description: "RFC 9457 problem details. `type` identifies the problem; see lld.md section 4 Problem types."
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
          examples: ["/problems/insufficient-stock"]
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
      required: [type, title, status]
    ValidationProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            errors:
              type: array
              items:
                type: object
                properties:
                  pointer:
                    type: string
                    description: "JSON Pointer to the invalid field, e.g. #/lines/0/quantity"
                  detail:
                    type: string
                required: [pointer, detail]
          required: [errors]
    InvalidTransitionProblem:
      description: "/problems/invalid-transition with why it was refused (lld.md D84, proposed; not yet sent by the M4/M5 code, Q-8)."
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            from:
              $ref: "#/components/schemas/OrderStatus"
            event:
              type: string
              enum: [start_checkout, pay, cancel]
          required: [from, event]
    Role:
      type: string
      enum: [patient, provider, finance_lead, operations_specialist, sre, data_analyst, none]
    Cents:
      type: integer
      description: "Whole US cents. The PRD fixes one currency (USD, C-5), so no currency field."
    SignInRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          examples: ["pat.example@example.test"]
        password:
          type: string
          minLength: 1
      required: [email, password]
    Me:
      type: object
      properties:
        user_id:
          type: integer
        display_name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        practice_id:
          type: ["integer", "null"]
        practice_name:
          type: ["string", "null"]
          description: the viewer's practice name (null for platform staff); screens.md S5 and S6 titles name the practice
        idle_expires_at:
          type: string
          format: date-time
      required: [user_id, display_name, role, practice_id, practice_name, idle_expires_at]
    CatalogItem:
      type: object
      properties:
        product_id:
          type: integer
        name:
          type: string
        price_cents:
          $ref: "#/components/schemas/Cents"
        units_in_stock:
          type: integer
          minimum: 0
        lowest_allowed_price_cents:
          $ref: "#/components/schemas/Cents"
      required: [product_id, name, price_cents, units_in_stock, lowest_allowed_price_cents]
    Catalog:
      type: object
      properties:
        patient_display_name:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/CatalogItem"
      required: [patient_display_name, items]
    SendOrderRequest:
      type: object
      additionalProperties: false
      properties:
        patient_id:
          type: integer
        lines:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            properties:
              product_id:
                type: integer
              quantity:
                type: integer
                minimum: 1
            required: [product_id, quantity]
      required: [patient_id, lines]
    OrderStatus:
      type: string
      enum: [sent, in_checkout, payment_failed, paid, needs_review, cancelled]
    OrderLine:
      type: object
      properties:
        product_id:
          type: integer
        name:
          type: string
        quantity:
          type: integer
          minimum: 1
        unit_price_cents:
          $ref: "#/components/schemas/Cents"
        line_total_cents:
          $ref: "#/components/schemas/Cents"
      required: [product_id, name, quantity, unit_price_cents, line_total_cents]
    Order:
      type: object
      properties:
        order_id:
          type: integer
          description: "Also the order number people see, e.g. 1042."
        status:
          $ref: "#/components/schemas/OrderStatus"
        lines:
          type: array
          items:
            $ref: "#/components/schemas/OrderLine"
        total_cents:
          $ref: "#/components/schemas/Cents"
        platform_fee_cents:
          $ref: "#/components/schemas/Cents"
        provider_payout_cents:
          $ref: "#/components/schemas/Cents"
        sent_at:
          type: string
          format: date-time
      required: [order_id, status, lines, total_cents, platform_fee_cents, provider_payout_cents, sent_at]
    PriceChangeNotice:
      type: object
      properties:
        product_id:
          type: integer
        name:
          type: string
        old_price_cents:
          $ref: "#/components/schemas/Cents"
        new_price_cents:
          $ref: "#/components/schemas/Cents"
      required: [product_id, name, old_price_cents, new_price_cents]
    OrderView:
      type: object
      properties:
        order_id:
          type: integer
        status:
          $ref: "#/components/schemas/OrderStatus"
        practice_name:
          type: string
        provider_display_name:
          type: string
        lines:
          type: array
          items:
            $ref: "#/components/schemas/OrderLine"
        total_cents:
          $ref: "#/components/schemas/Cents"
        price_changes:
          type: array
          items:
            $ref: "#/components/schemas/PriceChangeNotice"
        prices_held_until:
          type: ["string", "null"]
          format: date-time
        paid_at:
          type: ["string", "null"]
          format: date-time
        is_test_payment:
          type: boolean
          const: true
        hold_ended:
          type: boolean
          description: true when the order is sent again after a 30-minute price hold ended unpaid (status sent and a checkout was started); screens.md S2 "Your 30-minute price hold ended. These are the current prices."
      required: [order_id, status, practice_name, provider_display_name, lines, total_cents, price_changes, prices_held_until, paid_at, is_test_payment, hold_ended]
    Checkout:
      type: object
      properties:
        order_id:
          type: integer
        total_cents:
          $ref: "#/components/schemas/Cents"
        prices_held_until:
          type: string
          format: date-time
      required: [order_id, total_cents, prices_held_until]
    Receipt:
      type: object
      properties:
        order_id:
          type: integer
        amount_paid_cents:
          $ref: "#/components/schemas/Cents"
        paid_at:
          type: string
          format: date-time
        lines:
          type: array
          items:
            $ref: "#/components/schemas/OrderLine"
        is_test_payment:
          type: boolean
          const: true
      required: [order_id, amount_paid_cents, paid_at, lines, is_test_payment]
    Notice:
      type: object
      description: "Never carries items, quantities, amounts or health details (FR-044)."
      properties:
        practice_name:
          type: string
        sign_in_path:
          type: string
      required: [practice_name, sign_in_path]
    OpsOrderSummary:
      type: object
      description: "De-identified: no patient name or contact detail (FR-050)."
      properties:
        order_id:
          type: integer
        practice_name:
          type: string
        provider_display_name:
          type: string
        amount_paid_cents:
          $ref: "#/components/schemas/Cents"
        status:
          $ref: "#/components/schemas/OrderStatus"
        paid_at:
          type: ["string", "null"]
          format: date-time
      required: [order_id, practice_name, provider_display_name, amount_paid_cents, status, paid_at]
    OpsOrderPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/OpsOrderSummary"
        needs_review_count:
          type: integer
        next_cursor:
          type: ["string", "null"]
      required: [data, needs_review_count, next_cursor]
    BreakdownLine:
      type: object
      properties:
        name:
          type: string
        quantity:
          type: integer
        unit_price_cents:
          $ref: "#/components/schemas/Cents"
        unit_cost_cents:
          $ref: "#/components/schemas/Cents"
        line_cost_cents:
          $ref: "#/components/schemas/Cents"
        fee_share_cents:
          $ref: "#/components/schemas/Cents"
      required: [name, quantity, unit_price_cents, unit_cost_cents, line_cost_cents, fee_share_cents]
    OrderBreakdown:
      type: object
      description: "De-identified: order number only (FR-050)."
      properties:
        order_id:
          type: integer
        practice_name:
          type: string
        provider_display_name:
          type: string
        paid_at:
          type: string
          format: date-time
        amount_paid_cents:
          $ref: "#/components/schemas/Cents"
        item_cost_cents:
          $ref: "#/components/schemas/Cents"
        provider_payout_cents:
          $ref: "#/components/schemas/Cents"
        platform_fee_cents:
          $ref: "#/components/schemas/Cents"
        adds_up:
          type: boolean
        lines:
          type: array
          items:
            $ref: "#/components/schemas/BreakdownLine"
      required: [order_id, practice_name, provider_display_name, paid_at, amount_paid_cents, item_cost_cents, provider_payout_cents, platform_fee_cents, adds_up, lines]
    PracticePrice:
      type: object
      properties:
        product_id:
          type: integer
        name:
          type: string
        unit_cost_cents:
          $ref: "#/components/schemas/Cents"
        price_cents:
          $ref: "#/components/schemas/Cents"
        margin_basis_points:
          type: integer
          description: "(price - cost) / price, in hundredths of a percent."
        is_default:
          type: boolean
        set_by_display_name:
          type: ["string", "null"]
        lowest_allowed_price_cents:
          $ref: "#/components/schemas/Cents"
      required: [product_id, name, unit_cost_cents, price_cents, margin_basis_points, is_default, set_by_display_name, lowest_allowed_price_cents]
    PriceChange:
      type: object
      properties:
        product_name:
          type: string
        changed_by_display_name:
          type: string
        changed_at:
          type: string
          format: date-time
        old_price_cents:
          $ref: "#/components/schemas/Cents"
        new_price_cents:
          $ref: "#/components/schemas/Cents"
        reason:
          type: string
      required: [product_name, changed_by_display_name, changed_at, old_price_cents, new_price_cents, reason]
    PriceList:
      type: object
      properties:
        prices:
          type: array
          items:
            $ref: "#/components/schemas/PracticePrice"
        history:
          type: array
          items:
            $ref: "#/components/schemas/PriceChange"
        history_next_cursor:
          type: ["string", "null"]
      required: [prices, history, history_next_cursor]
    PriceChangeRequest:
      type: object
      additionalProperties: false
      description: "Exactly one of price_cents or margin_basis_points."
      properties:
        price_cents:
          type: integer
          minimum: 1
          maximum: 10000000
          description: "Whole US cents, at most $100,000.00 (lld.md D82, proposed). A margin whose computed price passes the same maximum is also 422 /problems/validation."
        margin_basis_points:
          type: integer
          minimum: 0
          maximum: 9999
        reason:
          type: string
          minLength: 1
          maxLength: 200
        expected_current_price_cents:
          $ref: "#/components/schemas/Cents"
      required: [reason, expected_current_price_cents]
      oneOf:
        - required: [price_cents]
        - required: [margin_basis_points]
    AttentionItem:
      type: object
      properties:
        kind:
          type: string
          enum: [awaiting_payment, low_stock, out_of_stock]
        label:
          type: string
        order_id:
          type: ["integer", "null"]
        product_id:
          type: ["integer", "null"]
        patient_display_name:
          type: ["string", "null"]
          description: "Set on awaiting_payment items: the patient's name, so S6 reads 'Ben Ortiz · $30.00 · awaiting payment for 4 days' whatever page of orders is loaded (M5-pass6 R4). The provider's own practice only."
        total_cents:
          oneOf:
            - $ref: "#/components/schemas/Cents"
            - type: "null"
          description: "Set on awaiting_payment items: the order total EP-30 shows for that order."
      required: [kind, label, order_id, product_id, patient_display_name, total_cents]
    ProductSales:
      type: object
      properties:
        product_id:
          type: integer
        name:
          type: string
        units_sold:
          type: integer
        patients_paid_cents:
          $ref: "#/components/schemas/Cents"
        provider_payout_cents:
          $ref: "#/components/schemas/Cents"
        units_in_stock:
          type: integer
      required: [product_id, name, units_sold, patients_paid_cents, provider_payout_cents, units_in_stock]
    PracticeDashboard:
      type: object
      properties:
        month:
          type: string
          examples: ["2026-10"]
        attention:
          type: array
          items:
            $ref: "#/components/schemas/AttentionItem"
        sales:
          type: array
          items:
            $ref: "#/components/schemas/ProductSales"
      required: [month, attention, sales]
    PracticeOrderSummary:
      type: object
      properties:
        order_id:
          type: integer
        patient_display_name:
          type: string
        total_cents:
          $ref: "#/components/schemas/Cents"
        status:
          $ref: "#/components/schemas/OrderStatus"
        sent_at:
          type: string
          format: date-time
        paid_at:
          type: ["string", "null"]
          format: date-time
      required: [order_id, patient_display_name, total_cents, status, sent_at, paid_at]
    PracticeOrderPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/PracticeOrderSummary"
        next_cursor:
          type: ["string", "null"]
      required: [data, next_cursor]
    StockMovement:
      type: object
      properties:
        product_name:
          type: string
        change:
          type: integer
        kind:
          type: string
          enum: [sale, sale_release, adjustment]
        reason:
          type: string
        actor_display_name:
          type: ["string", "null"]
        created_at:
          type: string
          format: date-time
        units_in_stock_after:
          type: integer
      required: [product_name, change, kind, reason, actor_display_name, created_at, units_in_stock_after]
    StockList:
      type: object
      properties:
        products:
          type: array
          items:
            type: object
            properties:
              product_id:
                type: integer
              name:
                type: string
              units_in_stock:
                type: integer
            required: [product_id, name, units_in_stock]
        history:
          type: array
          items:
            $ref: "#/components/schemas/StockMovement"
        history_next_cursor:
          type: ["string", "null"]
      required: [products, history, history_next_cursor]
    StockAdjustmentRequest:
      type: object
      additionalProperties: false
      properties:
        change:
          type: integer
          minimum: -1000000
          maximum: 1000000
          not:
            const: 0
          description: "A resulting count above 1,000,000 units is also 422 /problems/validation (lld.md D82, proposed)."
        reason:
          type: string
          minLength: 1
          maxLength: 200
        expected_units_in_stock:
          type: integer
          minimum: 0
        confirm_large_change:
          type: boolean
          default: false
      required: [change, reason, expected_units_in_stock]
    PlatformHealth:
      type: object
      description: "Totals only; never a single order or a patient (FR-053, NFR-012)."
      properties:
        month:
          type: string
        funnel:
          type: object
          properties:
            sent:
              type: integer
            checkout_started:
              type: integer
            paid:
              type: integer
            payment_failed:
              type: integer
            checkout_expired:
              type: integer
          required: [sent, checkout_started, paid, payment_failed, checkout_expired]
        median_minutes_to_pay:
          type: ["integer", "null"]
        out_of_stock_refusals:
          type: integer
        orders_needing_review:
          type: integer
        measures:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              value:
                type: number
              alert_line:
                type: ["number", "null"]
              needs_attention:
                type: boolean
            required: [name, value, alert_line, needs_attention]
        practices:
          type: array
          description: "Every practice, zeros included, by practice id; the whole list (under 200 rows), shown 25 at a time by the page."
          items:
            type: object
            properties:
              practice_name:
                type: string
              paid_cents:
                $ref: "#/components/schemas/Cents"
              fees_cents:
                $ref: "#/components/schemas/Cents"
              orders_sent:
                type: integer
              orders_paid:
                type: integer
            required: [practice_name, paid_cents, fees_cents, orders_sent, orders_paid]
      required: [month, funnel, median_minutes_to_pay, out_of_stock_refusals, orders_needing_review, measures, practices]
    FinancialReport:
      type: object
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        patient_payments_cents:
          $ref: "#/components/schemas/Cents"
        item_cost_cents:
          $ref: "#/components/schemas/Cents"
        provider_payouts_cents:
          $ref: "#/components/schemas/Cents"
        platform_fees_cents:
          $ref: "#/components/schemas/Cents"
        balanced:
          type: boolean
        gap_cents:
          $ref: "#/components/schemas/Cents"
        gap_order_ids:
          type: array
          items:
            type: integer
        gross_revenue_cents:
          $ref: "#/components/schemas/Cents"
        net_revenue_cents:
          $ref: "#/components/schemas/Cents"
        payouts_by_provider:
          type: array
          description: "The whole list (under 50 providers), shown 25 at a time by the page."
          items:
            type: object
            properties:
              provider_display_name:
                type: string
              practice_name:
                type: string
              payout_cents:
                $ref: "#/components/schemas/Cents"
            required: [provider_display_name, practice_name, payout_cents]
      required: [from, to, patient_payments_cents, item_cost_cents, provider_payouts_cents, platform_fees_cents, balanced, gap_cents, gap_order_ids, gross_revenue_cents, net_revenue_cents, payouts_by_provider]
    StaffMember:
      type: object
      properties:
        user_id:
          type: integer
        display_name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        role_since:
          type: ["string", "null"]
          format: date-time
        is_you:
          type: boolean
      required: [user_id, display_name, role, role_since, is_you]
    StaffList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/StaffMember"
      required: [data]
    RoleChangeRequest:
      type: object
      additionalProperties: false
      properties:
        role:
          type: string
          enum: [finance_lead, operations_specialist, sre, data_analyst, none]
        reason:
          type: string
          minLength: 1
          maxLength: 200
        expected_role:
          $ref: "#/components/schemas/Role"
        confirm_no_finance_lead:
          type: boolean
          default: false
      required: [role, reason, expected_role]
    AccessLogEntry:
      type: object
      properties:
        at:
          type: string
          format: date-time
        actor_display_name:
          type: string
        target_display_name:
          type: string
        from_role:
          $ref: "#/components/schemas/Role"
        to_role:
          $ref: "#/components/schemas/Role"
        reason:
          type: string
        outcome:
          type: string
          enum: [granted, refused]
      required: [at, actor_display_name, target_display_name, from_role, to_role, reason, outcome]
    AccessLogPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AccessLogEntry"
        next_cursor:
          type: ["string", "null"]
      required: [data, next_cursor]
    SystemHealth:
      type: object
      properties:
        month:
          type: string
        partial_month:
          type: boolean
        availability_percent:
          type: ["number", "null"]
          description: "5-minute slots with a successful /healthz ÷ slots elapsed in the month since the first ping ever (lld.md D86); null with no pings."
        availability_target_percent:
          type: number
          const: 99.5
        error_rate_percent:
          type: ["number", "null"]
        slow_page_percent:
          type: ["number", "null"]
          description: "Share of page.* responses slower than 2 s; null with no page traffic."
        slow_page_target_percent:
          type: number
          const: 5
      required: [month, partial_month, availability_percent, availability_target_percent, error_rate_percent, slow_page_percent, slow_page_target_percent]
    BuildInfo:
      type: object
      properties:
        commit:
          type: string
          pattern: "^[0-9a-f]{40}$"
        built_at:
          type: string
          format: date-time
      required: [commit, built_at]
